apiVersion: v1
kind: Namespace
metadata:
  name: ischemia
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ischemia-config
  namespace: ischemia
data:
  ML_URL: http://ml:5001
  DL_URL: http://dl:5001
  QML_URL: http://qml:5001
  MODELS_DIR: /app/models
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ischemia-app
  namespace: ischemia
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ischemia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ischemia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: ischemia-app
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ischemia
            - name: POSTGRES_DB
              value: ischemia
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ischemia-secrets
                  key: postgres-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "ischemia", "-d", "ischemia"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ischemia", "-d", "ischemia"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ischemia", "-d", "ischemia"]
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ischemia
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: ischemia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml
  template:
    metadata:
      labels:
        app: ml
    spec:
      serviceAccountName: ischemia-app
      containers:
        - name: ml
          image: ischemia-predictor:local
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "--bind", "0.0.0.0:5001", "services.model_service:app"]
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: MODEL_TYPE
              value: ML
            - name: MODELS_DIR
              valueFrom:
                configMapKeyRef:
                  name: ischemia-config
                  key: MODELS_DIR
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: ischemia
spec:
  selector:
    app: ml
  ports:
    - name: http
      port: 5001
      targetPort: http
---
