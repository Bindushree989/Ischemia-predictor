---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ischemia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: ischemia-app
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U ischemia -d ischemia; do sleep 2; done
      containers:
        - name: web
          image: ischemia-predictor:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ischemia-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: postgresql+psycopg2://ischemia:$(POSTGRES_PASSWORD)@postgres:5432/ischemia
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ischemia-secrets
                  key: secret-key
            - name: DATA_KEY
              valueFrom:
                secretKeyRef:
                  name: ischemia-secrets
                  key: data-key
            - name: ML_URL
              valueFrom:
                configMapKeyRef:
                  name: ischemia-config
                  key: ML_URL
            - name: DL_URL
              valueFrom:
                configMapKeyRef:
                  name: ischemia-config
                  key: DL_URL
            - name: QML_URL
              valueFrom:
                configMapKeyRef:
                  name: ischemia-config
                  key: QML_URL
            - name: MODELS_DIR
              valueFrom:
                configMapKeyRef:
                  name: ischemia-config
                  key: MODELS_DIR
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ischemia
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
