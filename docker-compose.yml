services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ischemia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ischemia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ischemia -d ischemia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ml:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:5001", "services.model_service:app"]
    environment:
      MODEL_TYPE: ML
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dl:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:5001", "services.model_service:app"]
    environment:
      MODEL_TYPE: DL
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qml:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:5001", "services.model_service:app"]
    environment:
      MODEL_TYPE: QML
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow-v2.db
      - --default-artifact-root
      - mlflow-artifacts:/
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  trainer:
    build: .
    profiles: ["training"]
    working_dir: /workspace
    command: ["dvc", "repro"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ischemia-predictor
    volumes:
      - .:/workspace
    depends_on:
      mlflow:
        condition: service_healthy

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ischemia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ischemia
      ML_URL: http://ml:5001
      DL_URL: http://dl:5001
      QML_URL: http://qml:5001
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATA_KEY: ${DATA_KEY:?Set DATA_KEY in .env}
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
      dl:
        condition: service_healthy
      qml:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_data:
